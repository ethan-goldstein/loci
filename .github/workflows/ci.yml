name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the build can only read the repository. The deploy job below asks for the two
# extra permissions GitHub Pages needs, and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Fails if a store, vector file, draft or home path is ever tracked.
      - run: npm run guard
      - run: npm run lint
      # Unit tests use a synthetic store and a hash embedder: no model, no private data.
      - run: npm test
      - run: npm run build
      # The public demo: invented conversations, indexed here, searched in the visitor's browser.
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: 'true'
      - run: npm run test:e2e:pages
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-report-pages
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist-pages

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
